[db]
port = 54322

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

# O projecto esta em plano que nao suporta vector buckets. Sem esta linha o
# CLI assume o default (`true`) e o `config push` aborta inteiro com HTTP 402 —
# levando com ele a politica de senha, que e o que interessa empurrar.
[storage.vector]
enabled = false

[auth]
enabled = true
# Politica de senha imposta pelo servidor.
#
# Sem estas duas linhas o GoTrue aceita 6 caracteres sem exigencia de classes
# (GOTRUE_PASSWORD_MIN_LENGTH=6, PASSWORD_REQUIRED_CHARACTERS vazio) — e era
# esse o piso real do produto, apesar de o ecra de redefinicao anunciar
# "minimo 8, maiuscula, minuscula e numero". A validacao existia so no cliente,
# portanto um POST direto ao /auth/v1 passava por cima.
#
# ATENCAO: em projeto hospedado isto NAO se aplica sozinho. E preciso
# `supabase config push`, ou definir o mesmo em Authentication > Policies no
# painel. Enquanto isso nao for feito, produção continua a aceitar 6 caracteres.
password_min_length = 8
password_required_characters = "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://lnlkahtugwmkznasapfd.supabase.co/auth/v1/callback"]
jwt_expiry = 3600
refresh_token_rotation_enabled = true
security_refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Segundo fator: TOTP (app autenticadora) e WebAuthn (chave/biometria).
# Em projeto hospedado isto exige `supabase config push` ou activacao no painel
# em Authentication > Multi-Factor Authentication.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.web_authn]
enroll_enabled = true
verify_enabled = true


